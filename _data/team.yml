# Single source of truth for team members.
#
# Fields:
#   name     - display name
#   group    - one of: lead, postdoc, phd, msc, ra, past  (see _data/team_groups.yml for order)
#   role     - short role line shown under the name
#   photo    - path to image, relative to site root
#   bio      - longer text (lead only, rendered as markdown)
#   working_on - one-line description used on project pages and the team page
#   links    - list of {label, url}
#   projects - list of project ids from _data/projects.yml
#
# Valid project ids:
#   semantic-task-oriented, quantum-networks, llm-networks, network-optimization-nfv

- name: "Dr. Omar Alhussein"
  group: lead
  role: "Assistant Professor"
  photo: "images/people/omar4.jpg"
  bio: |
    Omar Alhussein received his Ph.D. in Electrical and Computer Engineering from
    the University of Waterloo, Canada, in 2020, and his Master of Applied Science
    (MASc.) degree in Engineering Science from Simon Fraser University, Canada, in
    2015. Since Fall 2023, he has been an Assistant Professor in the Department of
    Computer Science at Khalifa University, United Arab Emirates. Prior to joining
    Khalifa University, he worked as a senior research engineer with the advanced
    networking team at Huawei Technologies Canada in Ottawa from 2020 to 2023.
    Dr. Alhussein serves as an Associate Editor for IEEE Transactions on Network
    and Service Management and Peer-to-Peer Networking and Applications (Springer
    Nature). With high-impact publications and award-winning patents, he has made
    significant contributions to the fields of networking and artificial
    intelligence. He is the recipient of multiple awards spanning both academic and
    industrial achievements. His research interests include network intelligence
    and optimization, semantic task-oriented systems, and quantum-assisted
    networked systems.
  links:
    - label: "omar.alhussein@ku.ac.ae"
      url: "mailto:omar.alhussein@ku.ac.ae"
    - label: "Google Scholar"
      url: "https://scholar.google.ca/citations?user=_4mKHpcAAAAJ&hl=en"
    - label: "ResearchGate"
      url: "https://www.researchgate.net/profile/Omar_Alhussein"
    - label: "KU Profile"
      url: "https://www.ku.ac.ae/college-people/omar-alhussein"
  projects: [semantic-task-oriented, quantum-networks, llm-networks, network-optimization-nfv]

