- id: semantic-task-oriented
  title: Semantic and Task-Oriented Networks
  url: projects/semantic-task-oriented.html
  image: images/splitNNzoomed.jpg
  blurb: >-
    Rethinking transmission around the task, not the bits: split inference,
    information-bottleneck training, efficient semantic communication systems, and topology-aware semantic systems
  description: |


  In 1949, Shannon and Weaver categorized the problem of communications into three levels, 
  namely (i) the technical: transmission of symbols; (ii) the semantic: transmission of meaning; 
  and (iii) the effectiveness: effect of semantic information exchange. While Shannon’s communication 
  model considers the technical aspect only. There is a growing interest in re-examining this fundamental 
  consideration and incorporating semantics into the 6G fabric. In Shannon’s communications theory, 
  a bit is the smallest unit of “information”. In this project, we are interested in exploring how 
  theoretical and practical advances in machine learning can be used to redefine the atomic unit of a 
  packet, moving beyond Shannon’s statistical bit of information to a contextual (or operational) iota of 
  information. That is, by incorporating effective semantics, we can move to goal-oriented autonomic 
  protocols that enable and improve the network. Central to the research is the exploration of machine learning advances, 
  particularly the information-bottleneck (IB) theory and generative AI, to improve networking protocols. 
  The project aims to integrate these paradigms into a new framework of semantic-based protocols, 
  transcending the traditional bit-level communication model.

- id: quantum-networks
  title: Quantum Computing for Networks
  url: projects/quantum-networks.html
  image: images/QIN_Year.png
  blurb: >-
    Where quantum algorithms genuinely help networked systems — detection,
    intrusion detection, optimization, and quantum channel analysis.
  description: |
  This project investigates two complementary paths toward quantum-enabled networking: 
  (1) applying quantum and quantum-inspired methods to optimize complex, 
  distributed communication networks, and (2) developing scalable quantum-network architectures and algorithms. 
  The goal is to enable efficient, privacy-preserving collaboration across multiple network domains, 
  with solutions that work on today’s classical systems while preparing for emerging quantum technologies.

