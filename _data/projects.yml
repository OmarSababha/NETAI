- id: semantic-task-oriented
  title: Semantic and Task-Oriented Networks
  url: projects/semantic-task-oriented.html
  image: images/splitNNzoomed.jpg
  blurb: >-
    Rethinking transmission around the task, not the bits: split inference,
    information-bottleneck training, efficient semantic communication systems, and topology-aware semantic systems
  description: |


    In 1949, Shannon and Weaver categorized the problem of communications into three levels,
    namely (i) the technical: transmission of symbols; (ii) the semantic: transmission of meaning;
    and (iii) the effectiveness: effect of semantic information exchange. While Shannon’s communication
    model considers the technical aspect only. There is a growing interest in re-examining this fundamental
    consideration and incorporating semantics into the 6G fabric. In Shannon’s communications theory,
    a bit is the smallest unit of “information”. In this project, we are interested in exploring how
    theoretical and practical advances in machine learning can be used to redefine the atomic unit of a
    packet, moving beyond Shannon’s statistical bit of information to a contextual (or operational) iota of
    information. That is, by incorporating effective semantics, we can move to goal-oriented autonomic
    protocols that enable and improve the network. Central to the research is the exploration of machine learning advances,
    particularly the information-bottleneck (IB) theory and generative AI, to improve networking protocols.
    The project aims to integrate these paradigms into a new framework of semantic-based protocols,
    transcending the traditional bit-level communication model.

- id: quantum-networks
  title: Quantum Computing for Networks
  url: projects/quantum-networks.html
  image: images/QIN_Year.png
  blurb: >-
    Where quantum algorithms genuinely help networked systems — detection,
    intrusion detection, optimization, and quantum channel analysis.
  description: |
    This project investigates two complementary paths toward quantum-enabled networking:
    (1) applying quantum and quantum-inspired methods to optimize complex,
    distributed communication networks, and (2) developing scalable quantum-network architectures and algorithms.
    The goal is to enable efficient, privacy-preserving collaboration across multiple network domains,
    with solutions that work on today’s classical systems while preparing for emerging quantum technologies.

- id: llm-networks
  title: LLM for Networks
  url: projects/llm-networks.html
  image: images/overall_routing_framework.png
  blurb: >-
    Making large language models useful to network operations with retrieval over
    3GPP standards, curriculum design, and LLM-assisted network optimization
  description: |
    Telecom knowledge is vast, highly structured, and largely locked in
    specification documents that are difficult to query. General-purpose language
    models perform poorly on it — they hallucinate specification detail and lack
    the long-context grounding the domain demands. This project builds and
    evaluates models that are specialized for network knowledge and network
    operations.

    TeleOracle, our fine-tuned retrieval-augmented generation system with
    long-context support for 3GPP standards, is the anchor of this work; the
    approach placed third in the ITU/Huawei competition on specializing large
    language models for telecom networks. Related work covers LLM-driven
    curriculum design for mobile networks, LLM-aided A\* search over
    non-geometric network graphs, strategic mechanism design when the agents in a
    system are themselves language models, and an LLM-enabled NWDAF as a step
    toward AI-native 6G network intelligence.

    **Open directions.** Agentic operation and closed-loop control of live
    networks; evaluation benchmarks that reflect operator tasks rather than
    question answering; and cost-efficient inference at the network edge.

- id: network-optimization-ai
  title: AI for Network Optimization
  url: projects/network-optimization-ai.html
  # image: TODO — a figure from the active ML for 6G paper would sit well here.
  blurb: >-
    Learning and optimization for network control — and the networks that pervasive
    AI services, agentic workloads and robotics will demand in return.
  description: |
    Classical network optimization assumes the problem is fully specified — demand is
    known, the channel is modelled, the objective can be written down. Real networks
    violate all three. This project develops learning-based methods that optimize
    network resources under uncertainty and, just as importantly, that are cheap
    enough to train and deploy on real systems rather than only in simulation.

    One central thread is data efficiency. Our vision work on active machine learning
    for 6G argues that the binding constraint on learned network functions is not
    model capacity but the cost of acquiring and annotating data, and shows how a
    network can query an oracle only for the samples it is most uncertain about.
    Related threads cover multi-agent approaches to network optimization, deep
    reinforcement learning for resource sharing and UAV trajectory design in
    multi-operator networks, and learned control policies that stay stable when
    conditions drift away from the ones they were trained on.

    The second thread runs in the opposite direction: the network as infrastructure
    for AI rather than as a consumer of it. Training is distributed across large
    accelerator clusters whose throughput is set by collective communication rather
    than by any single machine. Inference is moving to the edge, where it competes
    for the same radio, compute and energy budget as everything else. And a growing
    share of traffic is generated by agents and robots that act through the network
    on a closed loop, rather than by people waiting on a page to load. Each shift
    changes the traffic patterns, the latency requirements and the failure modes a
    network has to absorb. We are interested in what the network must become to
    serve them — how to place and schedule computation across edge, cloud and radio;
    how to keep latency predictable enough for control of physical systems; and how
    to plan capacity for demand that is generated by machines rather than by users.

    Holding the two threads together is one question: how much of a network's control
    loop can be learned, and how much should remain classical and verifiable. Our
    position is that the two belong together — learned components supply adaptivity
    where models are unavailable, classical components supply guarantees where
    correctness matters, and the design work lies in the interface between them.

    **Open directions.** Multi-agent learning for network optimization; networking for
    pervasive AI services, agentic workloads and robotics; optimization under
    adversarial conditions; and closing the gap between testbed and production
    deployment.

