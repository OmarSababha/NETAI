- id: network-optimization-nfv
  title: NFV-Enabled Multicast Services
  status: past
  url: projects/network-optimization-nfv.html
  image: images/phd_images/plan_abstract2.jpg
  blurb: >-
    PhD research on orchestrating NFV-enabled multicast services — joint composition,
    placement and routing, with robust online strategies under unknown demand.
  description: |
    Network function virtualization decouples network functions from proprietary
    hardware, which makes service-customized networks possible but shifts the
    difficulty into orchestration: which functions to compose, where to place them,
    and how to route traffic through them under uncertainty. This was the subject of
    Dr. Omar Alhussein's PhD research at the University of Waterloo, completed in 2020.

    The work addressed three problems essential to orchestrating network services of
    a multicast nature, in which a source is connected to a set of destinations
    through a service function chain: joint composition, placement and routing for
    NFV-enabled multicast services; robust online orchestration when demand is not
    known in advance; and dynamic topology design using deep reinforcement learning.

    The project is complete. Its learning-based successors are pursued under
    [AI for Network Optimization](network-optimization-ai.html), and the broader
    earlier research history is collected on the [past research](../research.html) page.

